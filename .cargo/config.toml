
# Сигналы читаются только с главного потока, а какой поток им станет,
# в многопоточном прогоне решает случай: тесты падали с «Signal reads must
# happen on the main GUI thread» вразнобой, по одному-четыре за раз.
# Пока это не исправлено в самих сигналах, тесты идут в один поток.
[env]
RUST_TEST_THREADS = "1"
