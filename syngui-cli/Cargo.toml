[package]
name = "syngui-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "syngui: сборка, упаковка и запуск приложений на syngui под Linux (x86_64, aarch64), Android и iOS"

[[bin]]
name = "syngui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = "0.45"
