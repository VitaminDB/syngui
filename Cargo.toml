[workspace]
resolver = "2"
members = [
    "syngui",
    "app/calculator",
    "app/widget_gallery_mss",
    "app/linamp",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
authors = ["Alexeyev Vitaly"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rubato = "0.16"

# Быстрая release-сборка для локальной работы: без LTO, параллельная
# кодогенерация, инкрементальная, без отладочной информации — в разы быстрее
# линкуется ценой 5–15% скорости. `cargo build --profile fast-release`
# (бинарники в target/fast-release). `--release` — только для публикаций.
[profile.fast-release]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
debug = false
